<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmation Card · Marie’s Dream Wedding</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=WindSong:wght@400;500&display=swap">
<style>
  :root{
    --ivory:#FAF7F2;
    --fern:#4A5A3D;
    --rose:#DE9687;
    --sage:#A8C29E;
    --moss:#889063;

    --ground:#EFEAE1;          /* studio table the card sits on */
    --panel:#FBF9F5;
    --edge:#DED6C8;
    --text:#3E4A36;
    --muted:#7C8570;
    --accent:#8E6A5E;
    --focus:#B08D4F;
    --shadow:0 1px 2px rgba(74,90,61,.10), 0 18px 44px -18px rgba(74,90,61,.34);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#20241D;
      --panel:#2A2F26;
      --edge:#3C4436;
      --text:#E4E7DC;
      --muted:#9AA48D;
      --accent:#E0AB9C;
      --focus:#D9BC85;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 22px 50px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --ground:#20241D;
    --panel:#2A2F26;
    --edge:#3C4436;
    --text:#E4E7DC;
    --muted:#9AA48D;
    --accent:#E0AB9C;
    --focus:#D9BC85;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 22px 50px -18px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--text);
    font-family:"Jost","Avenir Next",system-ui,sans-serif; font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2px solid var(--focus); outline-offset:3px; border-radius:2px}

  .wrap{
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    gap:24px; padding:28px 20px 56px;
  }

  /* ---------- masthead ---------- */
  .masthead{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
  .masthead h1{
    margin:0; font-size:15px; font-weight:400; letter-spacing:.30em;
    text-transform:uppercase; color:var(--text);
  }
  .masthead p{margin:0; font-size:13.5px; color:var(--muted); letter-spacing:.02em}

  /* ---------- the card ---------- */
  .stage{
    --cw:min(520px, calc(100vw - 44px), calc((100vh - 300px) / 1.4));
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .card{
    position:relative; width:var(--cw); height:calc(var(--cw) * 1.4);
    font-size:calc(var(--cw) / 100);        /* 1em === 1% of card width */
    background-color:#FAF7F2;
    background-image:var(--art);
    background-size:cover; background-position:center bottom;
    box-shadow:var(--shadow);
    --ink:#4A5A3D; --script:#DE9687;
    overflow:hidden;
  }
  .card[data-script="fern"]{--script:#4A5A3D}

  .block{
    position:absolute; left:7%; right:7%;
    top:calc(var(--y) * 100%); transform:translateY(-50%);
    text-align:center; margin:0; color:var(--ink);
    line-height:1.18; white-space:nowrap;
  }
  .block[data-caps]{
    text-transform:uppercase; font-weight:400;
    letter-spacing:var(--track); text-indent:var(--track); /* re-centres tracked caps */
  }
  .block[data-script-ink]{color:var(--script)}
  #b-names{
    font-family:"WindSong","Snell Roundhand",cursive; font-weight:500;
    line-height:1.05; padding:.08em 0;
  }
  #logo{
    position:absolute; left:50%; top:calc(var(--y) * 100%);
    transform:translate(-50%,-50%); width:23.5%; color:var(--script);
  }
  #logo svg{display:block; width:100%; height:auto}
  #heart{
    position:absolute; left:0; right:0; top:calc(var(--y) * 100%);
    transform:translateY(-50%); text-align:center;
    font-size:3.2em; line-height:1; color:var(--script);
  }

  /* ---------- editing affordances ---------- */
  [contenteditable]{
    border-radius:2px; transition:box-shadow .12s ease, background-color .12s ease;
  }
  .editing [contenteditable]:hover{
    box-shadow:0 0 0 1px rgba(136,144,99,.45);
    background-color:rgba(250,247,242,.5);
  }
  .editing [contenteditable]:focus{
    outline:none; box-shadow:0 0 0 1px var(--moss);
    background-color:rgba(250,247,242,.72);
  }
  .caption{
    font-size:12.5px; color:var(--muted); letter-spacing:.06em;
    min-height:1.2em; text-align:center;
  }

  /* ---------- controls ---------- */
  .controls{
    width:min(560px, calc(100vw - 40px));
    display:flex; flex-direction:column; gap:14px;
    background:var(--panel); border:1px solid var(--edge); border-radius:10px;
    padding:16px 18px;
  }
  .row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .row > .label{
    flex:0 0 auto; width:104px; font-size:11.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted);
  }
  .seg{display:flex; border:1px solid var(--edge); border-radius:999px; overflow:hidden}
  .seg button{
    appearance:none; border:0; background:transparent; cursor:pointer;
    font:inherit; font-size:13px; letter-spacing:.04em; color:var(--muted);
    padding:6px 16px;
  }
  .seg button[aria-pressed="true"]{background:var(--accent); color:var(--panel)}
  .btn{
    appearance:none; cursor:pointer; font:inherit; font-size:13px; letter-spacing:.04em;
    color:var(--text); background:transparent;
    border:1px solid var(--edge); border-radius:999px; padding:6px 16px;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--panel)}
  .btn.primary:hover{filter:brightness(1.08); color:var(--panel)}
  .btn[hidden]{display:none}
  .status{font-size:12px; color:var(--muted); margin-left:auto}
  input[type=file]{display:none}

  @media (prefers-reduced-motion: reduce){*{transition:none !important}}

  /* ---------- print: 5 x 7 in, edge to edge ---------- */
  @page{size:5in 7in; margin:0}
  @media print{
    body{background:#fff}
    .wrap{padding:0; gap:0; min-height:0}
    .masthead,.controls,.caption{display:none}
    .stage{--cw:5in}
    .card{box-shadow:none; page-break-inside:avoid}
    .editing [contenteditable]:hover,
    .editing [contenteditable]:focus{box-shadow:none; background:transparent}
  }
</style>
</head>

  const DEFAULTS = {
    eyebrow: "You’re confirmed for the wedding of",
    names:   "Marie & André",
    venue:   "Portugal",
    place:   "",
    date:    "5th of June 2027"
  };

  // One layout table drives the card on screen, in print, and in the exported PNG.
  const BLOCKS = [
    {key:"eyebrow", y:.243, size:2.30, track:.30, caps:true,  font:"jost",   ink:"ink"},
    {key:"names",   y:.325, size:10.6, track:0,   caps:false, font:"script", ink:"script", fit:true},
    {key:"venue",   y:.412, size:2.55, track:.22, caps:true,  font:"jost",   ink:"ink"},
    {key:"place",   y:.446, size:2.55, track:.22, caps:true,  font:"jost",   ink:"ink"},
    {key:"date",    y:.534, size:2.35, track:.26, caps:true,  font:"jost",   ink:"ink"}
  ];
  const LOGO_Y = .181, LOGO_W = .235, HEART_Y = .490, HEART_SIZE = 3.2, SIDE = .07;
  const INK = {ink:"#4A5A3D", rose:"#DE9687", fern:"#4A5A3D"};

  const STORE = "ma-confirmation-v1";
  const $ = id => document.getElementById(id);
  const card = $("card"), statusEl = $("status");

  let state = {text:{...DEFAULTS}, script:"rose", art:null};

  // ---------- persistence (this browser only) ----------
  try{
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if(saved && saved.text) state = {text:{...DEFAULTS, ...saved.text}, script:saved.script === "fern" ? "fern" : "rose", art:saved.art || null};
  }catch(e){ /* private window, cleared data - start fresh */ }

  let saveTimer = 0;
  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try{ localStorage.setItem(STORE, JSON.stringify(state)); say("Saved in this browser"); }
      catch(e){ say("Too large to keep in this browser — export before you close"); }
    }, 350);
  }
  let sayTimer = 0;
  function say(msg){
    statusEl.textContent = msg;
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => { statusEl.textContent = ""; }, 3200);
  }

  // ---------- render ----------
  function applyArt(){
    card.style.setProperty("--art", 'url("' + (state.art || ART) + '")');
    $("restore").hidden = !state.art;
  }
  function render(){
    for(const b of BLOCKS) $("b-" + b.key).textContent = state.text[b.key];
    card.dataset.script = state.script;
    $("ink-rose").setAttribute("aria-pressed", String(state.script === "rose"));
    $("ink-fern").setAttribute("aria-pressed", String(state.script === "fern"));
    applyArt();
    fitNames();
  }

  // The names line is the one that moves: it must stay on a single line
  // however long a name someone types.
  function fitNames(){
    const el = $("b-names"), base = 10.6;
    const room = card.clientWidth * (1 - 2 * SIDE);
    let size = base;
    el.style.fontSize = size + "em";
    for(let i = 0; i < 22 && el.scrollWidth > room && size > 4.2; i++){
      size = Math.max(4.2, size * 0.94);
      el.style.fontSize = size + "em";
    }
    return size;
  }

  // ---------- editing ----------
  for(const b of BLOCKS){
    const el = $("b-" + b.key);
    el.contentEditable = "true";
    el.spellcheck = false;
    el.setAttribute("role", "textbox");
    el.setAttribute("aria-label", b.key + " line");
    el.addEventListener("input", () => {
      state.text[b.key] = el.textContent.replace(/\s+/g, " ");
      if(b.fit) fitNames();
      persist();
    });
    el.addEventListener("keydown", ev => {
      if(ev.key === "Enter"){ ev.preventDefault(); el.blur(); }
    });
    el.addEventListener("paste", ev => {
      ev.preventDefault();
      const t = (ev.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ");
      document.execCommand("insertText", false, t);
    });
    el.addEventListener("blur", () => {
      if(!el.textContent.trim()){ el.textContent = state.text[b.key] = DEFAULTS[b.key]; persist(); }
    });
  }

  $("ink-rose").addEventListener("click", () => { state.script = "rose"; render(); persist(); });
  $("ink-fern").addEventListener("click", () => { state.script = "fern"; render(); persist(); });

  $("reset").addEventListener("click", () => {
    state.text = {...DEFAULTS};
    render(); persist(); say("Wording reset");
  });

  // ---------- swap the illustration ----------
  $("swap").addEventListener("click", () => $("file").click());
  $("restore").addEventListener("click", () => { state.art = null; render(); persist(); say("Villa restored"); });
  $("file").addEventListener("change", ev => {
    const f = ev.target.files && ev.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // resample to card resolution so it stays inside the browser's storage budget
        const w = Math.min(1600, img.naturalWidth);
        const h = Math.round(img.naturalHeight * (w / img.naturalWidth));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        state.art = c.toDataURL("image/jpeg", 0.9);
        render(); persist(); say("Illustration replaced");
      };
      img.onerror = () => say("That file could not be read as an image");
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
    ev.target.value = "";
  });

  // ---------- draw the card at print resolution ----------
  function drawText(ctx, text, {x, y, px, track, caps, family, weight, colour}){
    const t = caps ? text.toLocaleUpperCase("pt-PT") : text;
    ctx.font = weight + " " + px + "px " + family;
    ctx.fillStyle = colour;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    const spacing = track * px;
    if("letterSpacing" in ctx){
      ctx.letterSpacing = spacing + "px";
      const w = ctx.measureText(t).width - (spacing ? spacing : 0);
      ctx.fillText(t, x - w / 2, y);
      ctx.letterSpacing = "0px";
    }else{
      const chars = [...t];
      let w = -spacing;
      for(const ch of chars) w += ctx.measureText(ch).width + spacing;
      let cx = x - w / 2;
      for(const ch of chars){ ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + spacing; }
    }
  }

  function loadImage(src){
    return new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i); i.onerror = rej; i.src = src;
    });
  }

  async function paint(){
    await document.fonts.ready;
    const c = document.createElement("canvas");
    c.width = CARD_W; c.height = CARD_H;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#FAF7F2";
    ctx.fillRect(0, 0, CARD_W, CARD_H);

    // background, drawn the way CSS `cover` with a bottom anchor would
    const art = await loadImage(state.art || ART);
    const s = Math.max(CARD_W / art.naturalWidth, CARD_H / art.naturalHeight);
    const aw = art.naturalWidth * s, ah = art.naturalHeight * s;
    ctx.drawImage(art, (CARD_W - aw) / 2, CARD_H - ah, aw, ah);

    // wordmark
    const svg = document.querySelector("#logo svg").cloneNode(true);
    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    svg.querySelectorAll("[fill]").forEach(p => p.setAttribute("fill", INK[state.script]));
    const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
    const mark = await loadImage(url);
    const lw = CARD_W * LOGO_W, lh = lw * (235.6 / 1000);
    ctx.drawImage(mark, (CARD_W - lw) / 2, CARD_H * LOGO_Y - lh / 2, lw, lh);

    const em = CARD_W / 100;
    const fitted = fitNames();                      // reuse the size the page settled on
    for(const b of BLOCKS){
      drawText(ctx, state.text[b.key], {
        x: CARD_W / 2, y: CARD_H * b.y,
        px: (b.fit ? fitted : b.size) * em,
        track: b.track, caps: b.caps,
        family: b.font === "script" ? '"WindSong", cursive' : '"Jost", sans-serif',
        weight: b.font === "script" ? 500 : 400,
        colour: b.ink === "script" ? INK[state.script] : INK.ink
      });
    }
    drawText(ctx, "♡", {
      x: CARD_W / 2, y: CARD_H * HEART_Y, px: HEART_SIZE * em,
      track: 0, caps: false, family: '"Jost", sans-serif', weight: 400,
      colour: INK[state.script]
    });
    return c;
  }

  function fileName(){
    const slug = state.text.names.normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "confirmation";
    return slug + "-confirmed.png";
  }

  $("png").addEventListener("click", async () => {
    const btn = $("png");
    btn.disabled = true; say("Painting at print size…");
    try{
      const canvas = await paint();
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      const downloads = await claudeCap("downloads");
      if(downloads){
        await downloads.save({filename: fileName(), data: blob});
        say("Sent to your downloads");
      }else{
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName();
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        say("PNG ready — if nothing downloaded, use Print or PDF");
      }
    }catch(err){
      say("Could not paint the PNG — use Print or PDF instead");
    }finally{
      btn.disabled = false;
    }
  });

  $("print").addEventListener("click", () => window.print());

  // The published page may be granted a real save dialog; a plain file has none.
  function claudeCap(name){
    try{
      if(window.claude && typeof window.claude.use === "function") return window.claude.use(name);
    }catch(e){}
    return Promise.resolve(null);
  }

  window.addEventListener("resize", fitNames);
  document.fonts.ready.then(fitNames);
  render();
})();
</script>

</body>
</html>
